<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - OCS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1b3a57;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
            color: #1b3a57;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #e6eef6;
            box-sizing: border-box;
            background-color: #fcfdfe;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #1b3a57;
            background-color: #fff;
        }

        .btn-entrar {
            margin-top: 30px;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            background: #1b3a57;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-entrar:hover {
            background: #153049;
            transform: translateY(-1px);
        }

        .alerta {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
        }


        .alerta-erro {
            background: #fbeaea;
            color: #b00020;
            border: 1px solid #f5c2c7;
        }


        .alerta-info {
            background: #e6eef6;
            color: #1b3a57;
            border: 1px solid #d1dbe5;
        }

        .form-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #777;
        }

        .form-footer a {
            color: #1b3a57;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
</header>

<nav>
    <a th:href="@{/}">Página Principal</a>
</nav>

<div class="container">

    <h2>Acesso ao Sistema</h2>

    <div th:if="${param.pedidoEmAnalise}" class="alerta alerta-info">
        Seu cadastro como pesquisador está em análise pelo administrador.
    </div>

    <div th:if="${param.error}" class="alerta alerta-erro">
        E-mail ou senha inválidos, ou cadastro ainda não validado.
    </div>

    <div th:if="${param.logout}" class="alerta alerta-info">
        Logout realizado com sucesso.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">E-mail</label>
        <input type="text" id="username" name="username" placeholder="Digite seu e-mail" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

        <button type="submit" class="btn-entrar">
            Entrar
        </button>
    </form>

    <div class="form-footer">
        Ainda não tem conta? <a th:href="@{/contas/nova}">Cadastre-se aqui</a>.
    </div>

</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
