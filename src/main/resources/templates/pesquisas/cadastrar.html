<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa - OCS.EUC</title>

    <style>
        /* PADRONIZAÇÃO OCS.EUC */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 10px;
            transition: transform 0.2s ease;
        }

        nav a:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1b3a57;
            margin-top: 0;
        }

        /* FORMULÁRIOS */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1b3a57;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #e6eef6;
            background: #fdfdfd;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1b3a57;
            box-shadow: 0 0 0 2px rgba(27,58,87,0.1);
        }

        textarea {
            resize: vertical;
        }

        /* ALERTAS */
        .alerta-erro {
            background-color: #fbeaea;
            color: #b00020;
            border: 1px solid #f5c2c7;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        /* BOTÕES PADRONIZADOS */
        .acoes {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e6eef6;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn-primary {
            background: #1b3a57;
            color: white;
        }

        .btn-primary:hover {
            background: #153049;
            box-shadow: 0 4px 12px rgba(27,58,87,0.2);
        }

        .btn-secondary {
            background: #e6eef6;
            color: #1b3a57;
        }

        .btn-secondary:hover {
            background: #dbe7f2;
        }
    </style>
</head>

<body>

<header>
    <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
    <p style="color: #e0e0e0; margin-top: 8px;">Módulo de Pesquisas Acadêmicas</p>
</header>

<nav>
    <a th:href="@{/}">Página Principal</a>
</nav>

<div class="container">
    <h2 th:text="${pesquisa.id == null ? 'Cadastrar Pesquisa' : 'Editar Pesquisa'}">
        Cadastrar Pesquisa
    </h2>
    <hr style="border: 0; border-top: 1px solid #e6eef6; margin-bottom: 25px;">

    <form th:action="@{/pesquisas}"
          method="post"
          th:object="${pesquisa}">

        <div th:if="${#fields.hasAnyErrors()}" class="alerta-erro">
            <strong style="display: block; margin-bottom: 5px;">Atenção:</strong>
            <ul style="margin: 0; padding-left: 20px;">
                <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
            </ul>
        </div>

        <input type="hidden" th:field="*{id}" />

        <label for="titulo">Título da Pesquisa</label>
        <input type="text"
               id="titulo"
               th:field="*{titulo}"
               placeholder="Ex: Inclusão da Comunidade Surda no Ensino Superior"
               required />

        <label for="descricao">Descrição e Objetivos</label>
        <textarea id="descricao"
                  th:field="*{descricao}"
                  rows="5"
                  placeholder="Resumo do objetivo, metodologia e contexto da pesquisa"></textarea>

        <label for="status">Status da Pesquisa</label>
        <select id="status"
                th:field="*{status}"
                required>
            <option value="">Selecione o status atual</option>
            <option th:value="${T(br.edu.ifba.ocs.model.Pesquisa.Status).EM_ANDAMENTO}">
                Em andamento
            </option>
            <option th:value="${T(br.edu.ifba.ocs.model.Pesquisa.Status).CONCLUIDA}">
                Concluída
            </option>
        </select>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <label for="dataInicio">Data de Início</label>
                <input type="date"
                       id="dataInicio"
                       th:field="*{dataInicio}"
                       th:attr="max=${hoje}"
                       required />
            </div>
            <div>
                <label for="dataFim">
                    Data de Fim
                    <small style="font-weight:normal; color:#777;">(Opcional)</small>
                </label>
                <input type="date"
                       id="dataFim"
                       th:field="*{dataFim}"
                       th:attr="max=${hoje}" />
            </div>
        </div>

        <label for="urlParticipante">Link para Participação (Voluntários)</label>
        <input type="url"
               id="urlParticipante"
               th:field="*{urlParticipante}"
               placeholder="Ex: https://forms.gle/exemplo" />

        <label for="urlOrganizador">Link da Instituição / Organizador</label>
        <input type="url"
               id="urlOrganizador"
               th:field="*{urlOrganizador}"
               placeholder="Ex: https://ifba.edu.br/pesquisa" />

        <label for="arquivoResultados">Repositório de Resultados / Arquivo Final</label>
        <input type="url"
               id="arquivoResultados"
               th:field="*{arquivoResultados}"
               placeholder="Ex: https://repositorio.ifba.edu.br/pesquisa.pdf" />

        <div class="acoes">
            <button type="submit" class="btn btn-primary">
                Salvar Pesquisa
            </button>
            <a th:href="@{/pesquisas}" class="btn btn-secondary">
                Voltar
            </a>
        </div>

    </form>
</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
