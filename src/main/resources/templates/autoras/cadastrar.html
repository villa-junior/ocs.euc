<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Autora - OCS.EUC</title>

    <style>
        /* PADRONIZAÇÃO OCS.EUC */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 10px;
            transition: transform 0.2s ease;
        }

        nav a:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1b3a57;
            margin-top: 0;
            font-size: 1.5rem;
        }

        /* FORMULÁRIOS */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1b3a57;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 5px;
            border-radius: 10px;
            border: 1px solid #e6eef6;
            background: #fdfdfd;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #1b3a57;
            box-shadow: 0 0 0 2px rgba(27,58,87,0.1);
        }

        /* BOTÕES PADRONIZADOS */
        .btn {
            padding: 10px 22px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #1b3a57;
            color: white;
            margin-top: 15px;
        }

        .btn-primary:hover {
            background: #153049;
            box-shadow: 0 4px 12px rgba(27,58,87,0.2);
        }

        .btn-secondary {
            background: #e6eef6;
            color: #1b3a57;
            width: 100%;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .btn-secondary:hover {
            background: #dbe7f2;
        }
    </style>
</head>

<body>

<header>
    <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
    <p style="color: #e0e0e0; margin-top: 8px;">Cadastro de Autoria e Colaboradores</p>
</header>

<nav>
    <a th:href="@{/}">Página Principal</a>
</nav>

<div class="container">
    <h2>Cadastrar Autora</h2>
    <hr style="border: 0; border-top: 1px solid #e6eef6; margin-bottom: 20px;">

    <form th:action="@{/autoras}" th:object="${autora}" method="post">

        <input type="hidden" name="voltar" th:value="${voltar}">

        <label>Nome Completo</label>
        <input type="text" th:field="*{nome}" required placeholder="Ex: Maria Silva">

        <label>E-mail</label>
        <input type="email" th:field="*{email}" placeholder="exemplo@email.com">

        <label>Instituição / Filiação</label>
        <input type="text" th:field="*{instituicao}" placeholder="Ex: IFBA, UFBA, etc.">

        <label>Link do Currículo Lattes</label>
        <input type="text" th:field="*{lattes}" placeholder="http://lattes.cnpq.br/...">

        <button type="submit" class="btn btn-primary" style="width: 100%;">
            Salvar Registro
        </button>
    </form>

    <a th:if="${voltar != null}"
       th:href="${voltar}"
       class="btn btn-secondary">
        ⬅ Voltar para o cadastro da obra
    </a>

</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
