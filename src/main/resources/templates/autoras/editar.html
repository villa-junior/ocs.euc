<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Autora - OCS.EUC</title>

    <style>
        /* PADRONIZAÇÃO OCS.EUC */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 10px;
            transition: transform 0.2s ease;
        }

        nav a:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1b3a57;
            margin-top: 0;
            font-size: 1.5rem;
        }

        /* FORMULÁRIOS */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1b3a57;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 5px;
            border-radius: 10px;
            border: 1px solid #e6eef6;
            background: #fdfdfd;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #1b3a57;
            box-shadow: 0 0 0 2px rgba(27,58,87,0.1);
        }

        /* BOTÕES PADRONIZADOS */
        .btn {
            padding: 10px 22px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #1b3a57;
            color: white;
            margin-top: 15px;
            width: 100%;
        }

        .btn-primary:hover {
            background: #153049;
            box-shadow: 0 4px 12px rgba(27,58,87,0.2);
        }

        .btn-secondary {
            background: #e6eef6;
            color: #1b3a57;
            margin-top: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-secondary:hover {
            background: #dbe7f2;
        }
    </style>
</head>

<body>

<header>
    <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
    <p style="color: #e0e0e0; margin-top: 8px;">Edição de Perfil de Autoria</p>
</header>

<nav>
    <a th:href="@{/}">Página Principal</a>
</nav>

<div class="container">
    <h2>Editar Autora</h2>
    <hr style="border: 0; border-top: 1px solid #e6eef6; margin-bottom: 20px;">

    <form th:action="@{/autoras/editar/{id}(id=${autora.id})}"
          th:object="${autora}"
          method="post">

        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" th:value="${autora.nome}" required placeholder="Nome da autora">

        <label for="email">E-mail de Contato</label>
        <input type="email" id="email" name="email" th:value="${autora.email}" placeholder="exemplo@email.com">

        <label for="instituicao">Instituição / Filiação Acadêmica</label>
        <input type="text" id="instituicao" name="instituicao" th:value="${autora.instituicao}" placeholder="Ex: IFBA">

        <label for="lattes">Link do Currículo Lattes</label>
        <input type="text" id="lattes" name="lattes" th:value="${autora.lattes}" placeholder="http://lattes.cnpq.br/...">

        <button type="submit" class="btn btn-primary">
            Atualizar Registro
        </button>
    </form>

    <a th:href="@{/autoras}" class="btn btn-secondary">
        ⬅ Voltar para a lista
    </a>

</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
