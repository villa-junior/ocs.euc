<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Obra - OCS.EUC</title>

    <style>
        /* PADRONIZAÇÃO OCS.EUC */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 10px;
            transition: transform 0.2s ease;
        }

        nav a:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2, h3 {
            color: #1b3a57;
            margin-top: 0;
        }

        /* FORMULÁRIOS */
        label {
            font-weight: bold;
            color: #1b3a57;
            display: block;
            margin-bottom: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #e6eef6;
            background: #fdfdfd;
            box-sizing: border-box; /* Garante que o padding não quebre a largura */
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1b3a57;
            box-shadow: 0 0 0 2px rgba(27,58,87,0.1);
        }

        /* BOTÕES PADRONIZADOS */
        .btn {
            padding: 10px 20px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #1b3a57;
            color: white;
        }

        .btn-primary:hover {
            background: #153049;
            box-shadow: 0 4px 12px rgba(27,58,87,0.2);
        }

        .btn-secondary {
            background: #e6eef6;
            color: #1b3a57;
        }

        .btn-danger {
            background: #fbeaea;
            color: #b00020;
        }

        .btn-danger:hover {
            background: #f7dada;
        }

        /* SELEÇÃO DE AUTORAS */
        .autoras-selecionadas {
            border: 1px solid #e6eef6;
            border-radius: 14px;
            padding: 15px;
            background: #fbfcfe;
        }

        .autora-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e6eef6;
        }

        .autora-item:last-child {
            border-bottom: none;
        }

        .seletor {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #e6eef6;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .hidden {
            display: none;
        }

        .lista-pesquisa {
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border: 1px solid #e6eef6;
            border-radius: 10px;
        }

        .item-autora {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f4f8;
            transition: background 0.2s;
        }

        .item-autora:hover {
            background: #1b3a57;
            color: white;
        }

        strong {
            color: #1b3a57;
        }
    </style>
</head>

<body>

<header>
    <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
    <p style="color: #e0e0e0; margin-top: 8px;">Portal de Edição de Acervo</p>
</header>

<nav>
    <a th:href="@{/}">Página Principal</a>
</nav>

<div class="container">
    <h2>Editar Obra</h2>
    <hr style="border: 0; border-top: 1px solid #e6eef6; margin-bottom: 25px;">

    <form th:action="@{/obras/editar/{id}(id=${obra.id})}" method="post">

        <label>Título da Obra</label>
        <input type="text" name="titulo" th:value="${obra.titulo}" required placeholder="Insira o título completo">

        <label>Resumo / Sinopse</label>
        <textarea name="resumo" rows="5" th:text="${obra.resumo}" placeholder="Breve descrição da obra..."></textarea>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <label>Palavras-chave</label>
                <input type="text" name="palavrasChave" th:value="${obra.palavrasChave}" placeholder="Ex: Libras, Educação, Surdez">
            </div>
            <div>
                <label>Ano de Publicação</label>
                <input type="number" name="anoPublicacao" th:value="${obra.anoPublicacao}">
            </div>
        </div>

        <label>URL do Arquivo (Link Externo)</label>
        <input type="text" name="urlArquivo" th:value="${obra.urlArquivo}" placeholder="https://exemplo.com/arquivo.pdf">

        <label>Categoria do Acervo</label>
        <select name="categoriaId" required>
            <option value="">Selecione uma categoria</option>
            <option th:each="c : ${categorias}"
                    th:value="${c.id}"
                    th:selected="${obra.categoria != null and obra.categoria.id == c.id}"
                    th:text="${c.nome}">
            </option>
        </select>

        <h3 style="margin-top: 10px;">Gestão de Autoria</h3>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button type="button" class="btn btn-secondary" onclick="abrirSeletor()">
                + Selecionar Autoras
            </button>
            <a th:href="@{/autoras/cadastrar}" class="btn btn-secondary">
                Nova Autora
            </a>
        </div>

        <div id="seletorAutoras" class="seletor hidden">
            <label>Pesquisar Autora</label>
            <input type="text" id="pesquisaAutora" placeholder="Digite o nome para filtrar...">

            <div class="lista-pesquisa">
                <div th:each="a : ${autoras}"
                     class="item-autora"
                     th:data-id="${a.id}"
                     th:data-nome="${a.nome}"
                     th:text="${a.nome}"
                     onclick="selecionarAutora(this)">
                </div>
            </div>

            <div style="text-align: right; margin-top: 15px;">
                <button type="button" class="btn btn-danger" onclick="fecharSeletor()">
                    Fechar Pesquisa
                </button>
            </div>
        </div>

        <p style="font-size: 0.9rem; color: #666; margin-bottom: 8px;">Autoras vinculadas a esta obra:</p>
        <div id="listaAutoras" class="autoras-selecionadas"></div>

        <div id="autorasHidden"></div>

        <br><br>

        <div style="border-top: 1px solid #e6eef6; padding-top: 20px;">
            <button type="submit" class="btn btn-primary" style="padding: 12px 30px; font-size: 1rem;">
                Salvar Alterações
            </button>
            <a th:href="@{/}" class="btn btn-secondary" style="margin-left: 10px;">Cancelar</a>
        </div>

    </form>
</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    const autorasAdicionadas = new Set();

    function abrirSeletor() {
        document.getElementById("seletorAutoras").classList.remove("hidden");
        document.getElementById("pesquisaAutora").focus();
    }

    function fecharSeletor() {
        document.getElementById("seletorAutoras").classList.add("hidden");
        document.getElementById("pesquisaAutora").value = "";
        filtrar("");
    }

    document.getElementById("pesquisaAutora").addEventListener("input", e => {
        filtrar(e.target.value.toLowerCase());
    });

    function filtrar(texto) {
        document.querySelectorAll(".item-autora").forEach(item => {
            item.style.display =
                item.dataset.nome.toLowerCase().includes(texto)
                    ? "block"
                    : "none";
        });
    }

    function selecionarAutora(el) {
        const id = el.dataset.id;
        const nome = el.dataset.nome;

        if (autorasAdicionadas.has(id)) return;

        autorasAdicionadas.add(id);

        const div = document.createElement("div");
        div.className = "autora-item";
        div.id = "autora-" + id;

        div.innerHTML = `
            <span style="font-weight:500;">${nome}</span>
            <button type="button"
                    class="btn btn-danger"
                    style="padding: 4px 12px; font-size: 0.7rem;"
                    onclick="removerAutora('${id}')">
                Remover
            </button>
        `;

        document.getElementById("listaAutoras").appendChild(div);

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "autorasIds";
        input.value = id;
        input.id = "hidden-" + id;

        document.getElementById("autorasHidden").appendChild(input);
    }

    function removerAutora(id) {
        autorasAdicionadas.delete(id);
        document.getElementById("autora-" + id)?.remove();
        document.getElementById("hidden-" + id)?.remove();
    }
</script>

</body>
</html>
