<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Obra</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2, h3 {
            color: #1b3a57;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1b3a57;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
        }

        .section {
            margin-bottom: 40px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }

        .btn-primary {
            background: #1b3a57;
            color: white;
        }

        .btn-danger {
            background: #c62828;
            color: white;
        }

        .alerta-erro {
            background-color: #fdecea;
            color: #611a15;
            border: 1px solid #f5c2c7;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .autoras-selecionadas {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
        }

        .autora-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }

        .autora-item:last-child {
            border-bottom: none;
        }

        .seletor {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #ccc;
            background: #f9f9f9;
        }

        .hidden {
            display: none;
        }

        #pesquisaAutora {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #999;
        }

        .lista-pesquisa {
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .item-autora {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .item-autora:hover {
            background: #1b3a57;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Obra</h1>
</header>

<nav>
    <a th:href="@{/}">Página Principal</a>
    <a th:href="@{/obras}">Obras</a>
</nav>

<div class="container">
    <h2 th:text="${obra.id == null ? 'Cadastrar Obra' : 'Editar Obra'}">Cadastrar Obra</h2>

    <form th:action="@{/obras}"
          method="post"
          th:object="${obra}">

        <!-- ERROS (sempre dentro do form) -->
        <div th:if="${#fields.hasAnyErrors()}" class="alerta-erro">
            <ul>
                <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
            </ul>
        </div>

        <input type="hidden" th:field="*{id}" />

        <div class="section">
            <h3>Dados da Obra</h3>

            <label>Título</label>
            <input type="text"
                   th:field="*{titulo}"
                   placeholder="Ex: Educação Inclusiva e Comunidade Surda"
                   required>

            <label>Resumo</label>
            <textarea th:field="*{resumo}"
                      rows="4"
                      placeholder="Resumo do conteúdo da obra">
            </textarea>

            <label>Palavras-chave</label>
            <input type="text"
                   th:field="*{palavrasChave}"
                   placeholder="Ex: Libras, inclusão, educação">

            <label>Ano de Publicação</label>
            <input type="number"
                   th:field="*{anoPublicacao}"
                   placeholder="Ex: 2024">

            <label>URL do Arquivo</label>
            <input type="url"
                   th:field="*{urlArquivo}"
                   placeholder="Ex: https://repositorio.ifba.edu.br/obra.pdf">

            <label>Categoria</label>
            <select th:field="*{categoria.id}" required>
                <option value="">Selecione</option>
                <option th:each="c : ${categorias}"
                        th:value="${c.id}"
                        th:text="${c.nome}">
                </option>
            </select>
        </div>

        <!-- SELEÇÃO DE AUTORAS (JS MANTIDO) -->
        <div class="section">
            <h3>Selecionar Autoras</h3>

            <button type="button" class="btn btn-primary" onclick="abrirSeletor()">
                Selecionar Autoras
            </button>

            <a th:href="@{/autoras/cadastrar}" class="btn btn-primary">
                Cadastrar Autora
            </a>

            <div id="seletorAutoras" class="seletor hidden">
                <input type="text" id="pesquisaAutora"
                       placeholder="Digite o nome da autora...">

                <div class="lista-pesquisa">
                    <div th:each="a : ${autoras}"
                         class="item-autora"
                         th:data-id="${a.id}"
                         th:data-nome="${a.nome}"
                         th:text="${a.nome}"
                         onclick="selecionarAutora(this)">
                    </div>
                </div>

                <button type="button" class="btn btn-danger" onclick="fecharSeletor()">
                    Fechar
                </button>
            </div>

            <h3>Autoras selecionadas</h3>
            <div id="listaAutoras" class="autoras-selecionadas"></div>
            <div id="autorasHidden"></div>
        </div>

        <button type="submit" class="btn btn-primary">
            Salvar Obra
        </button>

    </form>
</div>

<script>
    const autorasAdicionadas = new Set();

    function abrirSeletor() {
        document.getElementById("seletorAutoras").classList.remove("hidden");
        document.getElementById("pesquisaAutora").focus();
    }

    function fecharSeletor() {
        document.getElementById("seletorAutoras").classList.add("hidden");
        document.getElementById("pesquisaAutora").value = "";
        filtrar("");
    }

    document.getElementById("pesquisaAutora").addEventListener("input", e => {
        filtrar(e.target.value.toLowerCase());
    });

    function filtrar(texto) {
        document.querySelectorAll(".item-autora").forEach(item => {
            const nome = item.dataset.nome.toLowerCase();
            item.style.display = nome.includes(texto) ? "block" : "none";
        });
    }

    function selecionarAutora(el) {
        const id = el.dataset.id;
        const nome = el.dataset.nome;

        if (autorasAdicionadas.has(id)) return;

        autorasAdicionadas.add(id);

        const div = document.createElement("div");
        div.className = "autora-item";
        div.id = "autora-" + id;

        div.innerHTML = `
            <span>${nome}</span>
            <button type="button"
                    class="btn btn-danger"
                    onclick="removerAutora('${id}')">
                Remover
            </button>
        `;

        document.getElementById("listaAutoras").appendChild(div);

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "autorasIds";
        input.value = id;
        input.id = "hidden-" + id;

        document.getElementById("autorasHidden").appendChild(input);
    }

    function removerAutora(id) {
        autorasAdicionadas.delete(id);
        document.getElementById("autora-" + id)?.remove();
        document.getElementById("hidden-" + id)?.remove();
    }
</script>


<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>


</body>
</html>
