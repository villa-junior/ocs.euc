<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada - OCS.EUC</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        .error-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-card {
            background: white;
            padding: 50px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 500px;
            border-top: 5px solid #1b3a57;
        }

        .error-card .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: #1b3a57;
            margin: 0;
        }

        .error-card h2 {
            color: #333;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .error-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-voltar {
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            background: #1b3a57;
            color: white;
            transition: opacity 0.2s;
            display: inline-block;
        }

        .btn-voltar:hover {
            opacity: 0.9;
        }

        footer {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
</header>

<main class="error-container">
    <div class="error-card">
        <p class="error-code">404</p>
        <h2>Ops! Página não encontrada</h2>
        <p>
            O conteúdo que você está procurando não existe ou foi movido.
            Verifique se o endereço digitado está correto.
        </p>
        <a th:href="@{/}" class="btn-voltar">Voltar para o Início</a>
    </div>
</main>

<footer>
    <p>© 2026 Observatório da Comunidade Surda — IFBA Euclides da Cunha</p>
</footer>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

</body>
</html>
