<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Legislação - OCS.EUC</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    header {
      background: #1b3a57;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: #153049;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 6px 10px;
      transition: transform 0.2s ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    h2 {
      color: #1b3a57;
      margin-top: 0;
    }


    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #1b3a57;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #e6eef6;
      background: #fdfdfd;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #1b3a57;
      box-shadow: 0 0 0 2px rgba(27,58,87,0.1);
    }

    textarea {
      resize: vertical;
    }


    .acoes {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e6eef6;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 22px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .btn-primary {
      background: #1b3a57;
      color: white;
    }

    .btn-primary:hover {
      background: #153049;
      box-shadow: 0 4px 12px rgba(27,58,87,0.2);
    }

    .btn-secondary {
      background: #e6eef6;
      color: #1b3a57;
    }

    .btn-secondary:hover {
      background: #dbe7f2;
    }
  </style>
</head>

<body>

<header>
  <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
  <p style="color: #e0e0e0; margin-top: 8px;">Gestão de Normas e Legislações</p>
</header>

<nav>
  <a th:href="@{/}">Página Principal</a>
</nav>

<div class="container">
  <h2 th:text="${legislacao.id == null ? 'Cadastrar Legislação' : 'Editar Legislação'}">
    Cadastrar Legislação
  </h2>
  <hr style="border: 0; border-top: 1px solid #e6eef6; margin-bottom: 20px;">

  <form th:action="@{/legislacoes/salvar}"
        th:object="${legislacao}"
        method="post">

    <input type="hidden" th:field="*{id}" />

    <label for="numero">Número da Legislação</label>
    <input type="text"
           id="numero"
           th:field="*{numero}"
           placeholder="Ex: Lei nº 10.436/2002"
           required />

    <label for="data">Data de Publicação</label>
    <input type="date"
           id="data"
           th:field="*{data}"
           th:attr="max=${hoje}"
           required />

    <label for="descricao">Descrição / Ementa</label>
    <textarea id="descricao"
              th:field="*{descricao}"
              rows="5"
              placeholder="Resumo ou descrição do que trata esta legislação..."></textarea>

    <label for="urlArquivo">Link para o Documento Completo</label>
    <input type="url"
           id="urlArquivo"
           th:field="*{urlArquivo}"
           placeholder="https://www.planalto.gov.br/..." />

    <div class="acoes">
      <button type="submit" class="btn btn-primary">
        Salvar Legislação
      </button>
      <a th:href="@{/legislacoes}" class="btn btn-secondary">
        Voltar
      </a>
    </div>

  </form>
</div>

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
