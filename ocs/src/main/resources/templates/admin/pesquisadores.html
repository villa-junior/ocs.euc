<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - OCS.EUC</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1b3a57;
            margin-top: 0;
            border-bottom: 1px solid #e6eef6;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #f8fbfe;
            color: #1b3a57;
            text-align: left;
            padding: 15px;
            font-size: 0.9rem;
            border-bottom: 2px solid #e6eef6;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
            color: #555;
        }

        tr:hover {
            background-color: #fcfdfe;
        }


        .btn-acoes {
            display: flex;
            gap: 10px;
        }

        .btn-aprovar {
            background: #e7f3e8;
            color: #2e7d32;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-aprovar:hover {
            background: #2e7d32;
            color: white;
        }

        .btn-rejeitar {
            background: #fbeaea;
            color: #b00020;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-rejeitar:hover {
            background: #b00020;
            color: white;
        }

        .msg-vazia {
            text-align: center;
            padding: 40px;
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>

<header>
    <h1>OCS.EUC - Observatório da Comunidade Surda</h1>
</header>

<nav>
    <a th:href="@{/static}">Página Principal</a>
</nav>

<div class="container">

    <h2>Validação de Novos Pesquisadores</h2>

    <table>
        <thead>
        <tr>
            <th>Nome do Solicitante</th>
            <th>E-mail</th>
            <th>Instituição / Vínculo</th>
            <th style="text-align: center;">Decisão</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${pesquisadores}">
            <td th:text="${p.nome}" style="font-weight: bold; color: #1b3a57;"></td>
            <td th:text="${p.email}"></td>
            <td th:text="${p.instituicao != null && !p.instituicao.isEmpty() ? p.instituicao : 'Não informada'}"></td>
            <td class="btn-acoes" style="justify-content: center;">

                <form th:action="@{/admin/pesquisadores/{id}/aprovar(id=${p.id})}" method="post">
                    <button type="submit" class="btn-aprovar"
                            >
                        Aprovar
                    </button>
                </form>

                <form th:action="@{/admin/pesquisadores/{id}/rejeitar(id=${p.id})}" method="post">
                    <button type="submit" class="btn-rejeitar"
                            >
                        Rejeitar
                    </button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(pesquisadores)}">
            <td colspan="4" class="msg-vazia">
                Não há pedidos de cadastro pendentes no momento.
            </td>
        </tr>
        </tbody>
    </table>

</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

</body>
</html>
