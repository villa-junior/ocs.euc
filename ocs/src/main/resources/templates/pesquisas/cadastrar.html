<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Pesquisa</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1b3a57;
        }

        label {
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #1b3a57;
            color: white;
        }
        .alerta-erro {
            background-color: #fdecea;
            color: #611a15;
            border: 1px solid #f5c2c7;
            padding: 12px;
            margin: 15px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>
<header>
    <h1>Cadastro de Pesquisa</h1>
</header>

<nav><a th:href="@{/}">Página Principal</a></nav>
<div class="container">


    <div th:if="${mensagem}" style="color:green" th:text="${mensagem}"></div>

    <div th:if="${erro}" style="color:red" th:text="${erro}"></div>

    <form th:action="@{/pesquisas}" method="post" th:object="${pesquisa}">
        <div th:if="${#fields.hasAnyErrors()}" class="alerta-erro">
            <ul>
                <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
            </ul>
        </div>
        <input type="hidden" th:field="*{id}" />
        <label>Título</label>
        <input type="text" th:field="*{titulo}" required />
        <div th:errors="*{titulo}" style="color:red"></div>

        <label>Descrição</label>
        <textarea th:field="*{descricao}"></textarea>

        <label>Status da Pesquisa</label>
        <select th:field="*{status}" required>
            <option value="">Selecione</option>
            <option th:value="${T(br.edu.ifba.ocs.model.Pesquisa.Status).EM_ANDAMENTO}">Em andamento</option>
            <option th:value="${T(br.edu.ifba.ocs.model.Pesquisa.Status).CONCLUIDA}">Concluída</option>
        </select>
        <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color:red"></div>

        <label>Data de Início</label>
        <input type="date"
               th:field="*{dataInicio}"
               th:attr="max=${hoje}"
               required />


        <label>Data de Fim <span style="font-weight:normal; font-size:0.87em; color:#888;">
    (preencha apenas se o status for "Concluída")
</span></label>


        <input type="date"
               th:field="*{dataFim}"
               th:attr="max=${hoje}" />


        <label>URL Participante</label>
        <input type="url" th:field="*{urlParticipante}" />

        <label>URL Organizador</label>
        <input type="url" th:field="*{urlOrganizador}" />

        <label>Arquivo de Resultados</label>
        <input type="text" th:field="*{arquivoResultados}" />

        <button type="submit" class="btn btn-primary">Salvar Pesquisa</button>
    </form>
</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
</body>
</html>
