<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Pesquisa</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #1b3a57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #153049;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1b3a57;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1b3a57;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }

        textarea {
            resize: vertical;
        }

        .acoes {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #1b3a57;
            color: white;
        }


        .alerta-erro {
            background-color: #fdecea;
            color: #611a15;
            border: 1px solid #f5c2c7;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Pesquisa</h1>
</header>

<nav>
    <a th:href="@{/}">Página Principal</a>

</nav>

<div class="container">
    <h2 th:text="${pesquisa.id == null ? 'Cadastrar Pesquisa' : 'Editar Pesquisa'}">
        Cadastrar Pesquisa
    </h2>

    <form th:action="@{/pesquisas}"
          method="post"
          th:object="${pesquisa}">

        <div th:if="${#fields.hasAnyErrors()}" class="alerta-erro">
            <ul>
                <li th:each="err : ${#fields.errors()}" th:text="${err}"></li>
            </ul>
        </div>

        <input type="hidden" th:field="*{id}" />


        <input type="hidden" th:field="*{id}" />

        <label for="titulo">Título da Pesquisa</label>
        <input type="text"
               id="titulo"
               th:field="*{titulo}"
               placeholder="Ex: Inclusão da Comunidade Surda no Ensino Superior"
               required />

        <label for="descricao">Descrição</label>
        <textarea id="descricao"
                  th:field="*{descricao}"
                  rows="4"
                  placeholder="Resumo do objetivo, metodologia e contexto da pesquisa">
        </textarea>

        <label for="status">Status da Pesquisa</label>
        <select id="status"
                th:field="*{status}"
                required>
            <option value="">Selecione</option>
            <option th:value="${T(br.edu.ifba.ocs.model.Pesquisa.Status).EM_ANDAMENTO}">
                Em andamento
            </option>
            <option th:value="${T(br.edu.ifba.ocs.model.Pesquisa.Status).CONCLUIDA}">
                Concluída
            </option>
        </select>

        <label for="dataInicio">Data de Início</label>
        <input type="date"
               id="dataInicio"
               th:field="*{dataInicio}"
               th:attr="max=${hoje}"
               required />

        <label for="dataFim">
            Data de Fim
            <span style="font-weight:normal; font-size:0.85em; color:#777;">
                (somente se a pesquisa estiver concluída)
            </span>
        </label>
        <input type="date"
               id="dataFim"
               th:field="*{dataFim}"
               th:attr="max=${hoje}" />

        <label for="urlParticipante">URL do Participante</label>
        <input type="url"
               id="urlParticipante"
               th:field="*{urlParticipante}"
               placeholder="Ex: https://link-do-participante.com" />

        <label for="urlOrganizador">URL do Organizador</label>
        <input type="url"
               id="urlOrganizador"
               th:field="*{urlOrganizador}"
               placeholder="Ex: https://link-do-organizador.com" />

        <label for="arquivoResultados">Arquivo / Link dos Resultados</label>
        <input type="text"
               id="arquivoResultados"
               th:field="*{arquivoResultados}"
               placeholder="Ex: https://repositorio.ifba.edu.br/pesquisa.pdf" />

        <div class="acoes">
            <button type="submit" class="btn btn-primary">
                Salvar
            </button>


        </div>

    </form>
</div>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
